# Use H2 in-memory database for tests to avoid depending on local MySQL
spring.datasource.url=jdbc:h2:mem:quizzdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 dialect and auto DDL for tests
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Prevent Spring from trying to initialize MySQL-specific scripts
spring.sql.init.mode=never

# JWT secret for tests only (do NOT commit production secret here)
jwt.secret=changeme-for-tests
