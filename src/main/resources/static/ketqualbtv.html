<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kết quả - 10</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #e5ebf5;
            min-height: 100vh;
        }

        /* =========================================================
           ===============  NAVBAR  =================================
           ========================================================= */
        .navbar {
            background: #fff;
            padding: 14px 36px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 1px 6px rgba(0,0,0,0.08);
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .logo-box {
            display:flex;
            gap:10px;
            align-items:center;
            font-weight:600;
            font-size:17px;
            flex:1;
        }

        .logo-circle { 
            width:36px; 
            height:36px; 
            border-radius:50%; 
            background:#e6e6e6; 
        }

        .nav-links {
            flex:2;
            display:flex;
            justify-content: space-between;
            align-items:center;
            font-weight:600;
            font-size:15px;
            position:relative;
            margin:0 30px;
        }

        .nav-item {
            cursor:pointer;
            color:#000;
            transition:opacity .15s ease;
            padding:4px 8px;
            position:relative;
        }

        .nav-item:hover { 
            opacity:0.7; 
        }

        .active {
            background: linear-gradient(90deg, #0453F4, #F600FF);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent !important;
        }

        .dropdown-menu {
            position: absolute;
            top: calc(100% + 8px);
            left: 0;
            min-width: 200px;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 6px 20px rgba(3,10,18,0.08);
            padding: 6px 0;
            display: none;
            flex-direction: column;
            z-index: 200;
        }

        .dropdown-item {
            padding: 10px 14px;
            font-size: 14px;
            color: #0b0b0b;
            white-space: nowrap;
        }

        .dropdown-item:hover {
            background: #f4f6fb;
            cursor: pointer;
        }

        .user-profile-btn {
            display: flex;
            border: none;
            background: #b8f1c4;
            padding: 4px 12px 4px 4px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 500;
            font-size: 15px;
            transition: all 0.2s ease;
            align-items: center;
            gap: 8px;
            color: #000;
        }

        .user-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #fff;
        }

        /* ========================================================= */

        .container {
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
        }

        .page-title {
            font-size: 18px;
            font-weight: 600;
            color: #000;
            margin-bottom: 20px;
        }

        /* Summary Card */
        .summary-card {
            background: #fff;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .summary-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            gap: 16px;
        }

        .summary-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .summary-label {
            font-size: 14px;
            font-weight: 600;
            color: #333;
        }

        .summary-value {
            font-size: 14px;
            color: #666;
            padding: 8px 12px;
            background: #f5f5f5;
            border-radius: 6px;
            text-align: center;
        }

        /* Question Result Card */
        .questions-container {
            max-height: 400px;
            overflow-y: auto;
            padding-right: 8px;
            margin-bottom: 20px;
        }

        .questions-container::-webkit-scrollbar {
            width: 8px;
        }

        .questions-container::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        .questions-container::-webkit-scrollbar-thumb {
            background: linear-gradient(90deg, #0453F4, #F600FF);
            border-radius: 10px;
        }

        .question-result-card {
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
            position: relative;
        }

        .question-result-card.correct {
            background: #d4edda;
            border: 2px solid #28a745;
        }

        .question-result-card.incorrect {
            background: #f8d7da;
            border: 2px solid #dc3545;
        }

        .question-result-header {
            font-size: 15px;
            font-weight: 600;
            color: #000;
            margin-bottom: 12px;
        }

        .answer-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 12px;
            margin-bottom: 8px;
            background: rgba(255,255,255,0.7);
            border-radius: 8px;
        }

        .answer-radio {
            width: 18px;
            height: 18px;
        }

        .answer-radio.correct {
            accent-color: #28a745;
        }

        .answer-radio.incorrect {
            accent-color: #dc3545;
        }

        .answer-text {
            font-size: 14px;
            color: #333;
            flex: 1;
        }

        /* Navigation */
        .navigation {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin-top: 16px;
        }

        .nav-btn {
            width: 40px;
            height: 40px;
            border: none;
            border-radius: 50%;
            background: linear-gradient(90deg, #0453F4, #F600FF);
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(4, 83, 244, 0.3);
        }

        .nav-btn:hover {
            transform: scale(1.1);
        }

        .nav-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            box-shadow: none;
        }

        .page-indicator {
            background: linear-gradient(90deg, #0453F4, #F600FF);
            color: #fff;
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 14px;
        }

        /* Action Buttons */
        .action-buttons {
            display: flex;
            gap: 16px;
            justify-content: center;
            margin-top: 24px;
        }

        .btn {
            border: none;
            padding: 14px 40px;
            border-radius: 24px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(4, 83, 244, 0.3);
        }

        .btn-save {
            background: linear-gradient(90deg, #0453F4, #F600FF);
            color: #fff;
        }

        .btn-save:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(4, 83, 244, 0.4);
        }

        .btn-back {
            background: #fff;
            color: #333;
            border: 2px solid #ddd;
            box-shadow: none;
        }

        .btn-back:hover {
            background: #f5f5f5;
        }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: white;
            padding: 40px;
            border-radius: 16px;
            text-align: center;
            min-width: 400px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
        }

        .modal h3 {
            margin-bottom: 30px;
            color: #000;
            font-size: 18px;
            font-weight: 600;
        }

        .modal-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .modal-btn {
            padding: 12px 32px;
            border: none;
            border-radius: 24px;
            font-weight: 600;
            cursor: pointer;
            font-size: 15px;
            transition: all 0.2s ease;
        }

        .modal-btn.primary {
            background: linear-gradient(90deg, #0453F4, #F600FF);
            color: white;
            box-shadow: 0 4px 12px rgba(4, 83, 244, 0.3);
        }

        .modal-btn.primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(4, 83, 244, 0.4);
        }

        .modal-btn.secondary {
            background: white;
            color: #333;
            border: 2px solid #ddd;
        }

        .modal-btn.secondary:hover {
            background: #f5f5f5;
        }

        .success-message {
            background: linear-gradient(90deg, #0453F4, #F600FF);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-size: 24px;
            font-weight: 700;
        }
    </style>
</head>

<body>
    <!-- ====================== NAVBAR ====================== -->
    <div class="navbar">
        <div class="logo-box">
            <div class="logo-circle"></div>
            <span>Logo + tên</span>
        </div>

        <div class="nav-links">
            <span class="nav-item" onclick="goHome()">Home</span>
            <span class="nav-item" onclick="goClass()">Lớp học</span>

            <div class="nav-item active" id="libraryBtn" onclick="toggleLibrary(event)">
                <span style="background: linear-gradient(90deg, #0453F4, #F600FF); -webkit-background-clip: text; background-clip: text; color: transparent;">Thư viện</span> ▼
                <div class="dropdown-menu" id="dropdownMenu">
                    <div class="dropdown-item" onclick="openPage('library_saved')">Danh sách quiz đã lưu</div>
                    <div class="dropdown-item" onclick="openPage('library_history')">Lịch sử làm bài</div>
                </div>
            </div>

            <span class="nav-item" onclick="ThongBao()">🔔</span>
        </div>

        <button class="user-profile-btn" id="userProfileBtn" onclick="profileClick()">
            <div class="user-avatar"></div>
            <span>NPN</span>
        </button>
    </div>

    <!-- ===================== MAIN ===================== -->
    <div class="container">
        <div class="page-title">Kết quả</div>

        <!-- Summary Card -->
        <div class="summary-card">
            <div class="summary-grid">
                <div class="summary-item">
                    <span class="summary-label">Tên bài quiz:</span>
                    <div class="summary-value" id="quizName">-</div>
                </div>
                <div class="summary-item">
                    <span class="summary-label">Số câu:</span>
                    <div class="summary-value" id="totalQuestions">-</div>
                </div>
                <div class="summary-item">
                    <span class="summary-label">Số câu đúng:</span>
                    <div class="summary-value" id="correctAnswers">-</div>
                </div>
                <div class="summary-item">
                    <span class="summary-label">Số câu sai:</span>
                    <div class="summary-value" id="incorrectAnswers">-</div>
                </div>
                <div class="summary-item">
                    <span class="summary-label">Thời gian làm bài:</span>
                    <div class="summary-value" id="timeTaken">- phút</div>
                </div>
            </div>
        </div>

        <!-- Questions Results -->
        <div class="questions-container" id="questionsContainer">
            <!-- Questions will be loaded here -->
        </div>

        <!-- Action Buttons -->
        <div class="action-buttons">
            <button class="btn btn-save" onclick="showSaveModal()">Lưu kết quả</button>
            <button class="btn btn-back" onclick="goBack()">Quay lại</button>
        </div>
    </div>

    <!-- Modal xác nhận lưu -->
    <div class="modal-overlay" id="confirmModal">
        <div class="modal">
            <h3>Lưu kết quả đề thi này nhé?</h3>
            <div class="modal-buttons">
                <button class="modal-btn primary" id="confirmSave">Đồng ý</button>
                <button class="modal-btn secondary" id="cancelSave">Quay lại</button>
            </div>
        </div>
    </div>

    <!-- Modal thành công -->
    <div class="modal-overlay" id="successModal">
        <div class="modal">
            <div class="success-message">Đã lưu thành công !</div>
        </div>
    </div>

    <!-- ===================== JAVASCRIPT ===================== -->
    <script>
        // Get quiz data from localStorage
        const quizResults = JSON.parse(localStorage.getItem('quizResults') || '{}');
        const quizData = JSON.parse(localStorage.getItem('currentQuizData') || '{}');
        
        let currentPage = 0;
        const questionsPerPage = 1;

        // Load summary
        function loadSummary() {
            document.getElementById('quizName').textContent = quizResults.quizName || '-';
            document.getElementById('totalQuestions').textContent = quizResults.totalQuestions || '-';
            document.getElementById('correctAnswers').textContent = quizResults.correctAnswers || '-';
            document.getElementById('incorrectAnswers').textContent = quizResults.incorrectAnswers || '-';
            
            const timeTaken = quizResults.timeTaken || 0;
            const minutes = Math.floor(timeTaken / 60);
            const seconds = timeTaken % 60;
            document.getElementById('timeTaken').textContent = `${minutes}:${seconds.toString().padStart(2, '0')} phút`;
        }

        // Load question results
        function loadQuestionResults() {
            if (!quizData.questions || !quizData.userAnswers) {
                document.getElementById('questionsContainer').innerHTML = '<p>Không có dữ liệu kết quả</p>';
                return;
            }

            const container = document.getElementById('questionsContainer');
            container.innerHTML = '';

            const question = quizData.questions[currentPage];
            const userAnswer = quizData.userAnswers[currentPage];
            const isCorrect = userAnswer === question.correctAnswer;

            const card = document.createElement('div');
            card.className = `question-result-card ${isCorrect ? 'correct' : 'incorrect'}`;
            
            let answersHTML = '';
            question.answers.forEach((answer, index) => {
                const isUserAnswer = index === userAnswer;
                const isCorrectAnswer = index === question.correctAnswer;
                const radioClass = isCorrectAnswer ? 'correct' : (isUserAnswer ? 'incorrect' : '');
                const checked = isUserAnswer ? 'checked' : '';
                
                answersHTML += `
                    <div class="answer-item">
                        <input type="radio" class="answer-radio ${radioClass}" ${checked} disabled>
                        <span class="answer-text">Đáp án: ${answer}</span>
                    </div>
                `;
            });

            card.innerHTML = `
                <div class="question-result-header">Câu hỏi: ${question.question}</div>
                ${answersHTML}
                <div class="navigation">
                    <button class="nav-btn" id="prevBtn" onclick="prevQuestion()" ${currentPage === 0 ? 'disabled' : ''}>◀</button>
                    <div class="page-indicator">${currentPage + 1}/${quizData.questions.length}</div>
                    <button class="nav-btn" id="nextBtn" onclick="nextQuestion()" ${currentPage === quizData.questions.length - 1 ? 'disabled' : ''}>▶</button>
                </div>
            `;

            container.appendChild(card);
        }

        function prevQuestion() {
            if (currentPage > 0) {
                currentPage--;
                loadQuestionResults();
            }
        }

        function nextQuestion() {
            if (currentPage < quizData.questions.length - 1) {
                currentPage++;
                loadQuestionResults();
            }
        }

        // Show save modal
        function showSaveModal() {
            document.getElementById('confirmModal').classList.add('active');
        }

        // Confirm save
        document.getElementById('confirmSave').addEventListener('click', () => {
            document.getElementById('confirmModal').classList.remove('active');
            document.getElementById('successModal').classList.add('active');

            // Auto close and redirect after 2 seconds
            setTimeout(() => {
                document.getElementById('successModal').classList.remove('active');
                window.location.href = 'ThuvienDSL.html';
            }, 2000);
        });

        // Cancel save
        document.getElementById('cancelSave').addEventListener('click', () => {
            document.getElementById('confirmModal').classList.remove('active');
        });

        // Go back
        function goBack() {
            window.location.href = 'ThuvienDSL.html';
        }

        // Close modal on outside click
        document.getElementById('confirmModal').addEventListener('click', (e) => {
            if (e.target.id === 'confirmModal') {
                document.getElementById('confirmModal').classList.remove('active');
            }
        });

        // Navbar functions
        function toggleLibrary(e){
            e.stopPropagation();
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));

            const lib = document.getElementById('libraryBtn');
            const menu = document.getElementById('dropdownMenu');

            lib.classList.add('active');

            if(menu.style.display === 'flex'){
                menu.style.display = 'none';
                lib.classList.remove('active');
            } else {
                menu.style.display = 'flex';
            }
        }

        function profileClick(){
            window.location.href = "taikhoansinhvien.html";
        }

        document.addEventListener('click', function(e){
            const lib = document.getElementById('libraryBtn');
            const menu = document.getElementById('dropdownMenu');
            if(!lib.contains(e.target)){
                menu.style.display='none';
                lib.classList.remove('active');
            }
        });

        // Get quiz data from localStorage

        function openPage(page){
            if(page === 'library_saved'){ window.location.href = "ThuvienDSL.html"; }
            if(page === 'library_history'){ alert("Đi đến lịch sử làm bài"); }
        }

        function goHome() {
            window.location.href = "trangchu.html";
        }

        function goClass() {
            window.location.href = "Dsachlophoc.html";
        }

        function ThongBao() {
            window.location.href = "Thongbaosvien.html";
        }

        // Lấy tên người dùng từ localStorage
        const userName = localStorage.getItem("username") || "NPN";
        const profileNameBtn = document.querySelector('#userProfileBtn span');
        if (profileNameBtn) {
            profileNameBtn.textContent = userName;
        }

        // Initialize
        loadSummary();
        loadQuestionResults();
    </script>
</body>
</html>
