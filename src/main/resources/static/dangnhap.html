<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<title>Đăng nhập</title>
<style>
body{margin:0;font-family:Arial;background:#eef4ff;display:flex;justify-content:center;align-items:center;height:100vh}
.container{background:white;width:700px;border-radius:20px;display:flex;box-shadow:0 4px 10px rgba(0,0,0,0.1)}
.left{width:45%;background:#dfeaff;border-radius:20px 0 0 20px;display:flex;justify-content:center;align-items:center}
.right{width:55%;padding:40px}
input{width:100%;padding:12px;border:1px solid #ccc;border-radius:8px;margin-bottom:14px}
.btn{width:100%;padding:12px;background:#4a60f4;color:white;border:none;border-radius:8px;cursor:pointer}
</style>
</head>

<body>

<div class="container">
    <div class="left">
        <img src="" alt="Img" width="120">
    </div>

    <div class="right">
        <h2>Welcome back</h2>

        <input id="loginUsername" type="text" placeholder="Tên đăng nhập">
        
        <input id="loginPassword" type="password" placeholder="Mật khẩu">

        <button class="btn" onclick="login()">Đăng nhập</button>

        <p style="margin-top:10px">
            Chưa có tài khoản?
            <a href="dangky.html">Đăng ký</a>
        </p>
    </div>
</div>

<script>
// Đoạn JS trong dangnhap.html xử lý kết quả trả về từ API Login
async function login() {
    const usernameVal = document.getElementById("loginUsername").value; // ID ô nhập user
    const passwordVal = document.getElementById("loginPassword").value; // ID ô nhập pass

    try {
        // Gọi vào API /login vừa tạo
        const response = await fetch('http://localhost:8080/api/v1/users/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
                username: usernameVal, 
                password: passwordVal 
            })
        });

        if (response.ok) {
            const user = await response.json();
            
            // Lưu thông tin để các trang sau dùng
            localStorage.setItem("user", JSON.stringify(user));
            
            alert("Đăng nhập thành công!");

            // Tự động chuyển trang dựa theo Role (như logic bạn muốn)
            if (user.role === "TEACHER") {
                window.location.href = "trangchugiaovien.html";
            } else {
                window.location.href = "trangchu.html";
            }
        } else {
            // Nếu lỗi (400 Bad Request) -> Hiện thông báo
            const msg = await response.text();
            alert("Đăng nhập thất bại: " + msg);
        }
    } catch (err) {
        console.error(err);
        alert("Không kết nối được Server!");
    }
}
</script>

</body>
</html>
