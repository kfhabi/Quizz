spring.application.name=quizz

# Địa chỉ của MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/quizz_db?useSSL=false&serverTimezone=UTC

# Thông tin đăng nhập MySQL (use env vars in production)
# Set environment variables `SPRING_DATASOURCE_USERNAME` and `SPRING_DATASOURCE_PASSWORD`
# Example (PowerShell): $env:SPRING_DATASOURCE_USERNAME='appuser'; $env:SPRING_DATASOURCE_PASSWORD='secret'
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:220520}

# Cấu hình JPA
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT settings
jwt.secret=${JWT_SECRET:change-me-dev-secret-please-replace}
jwt.expiration-ms=86400000